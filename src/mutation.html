<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      :root {
        --bg: #ffffff;
        --text: #000000;
        --accent: #3498db;
      }
      body.dark-mode {
        --bg: #1a1a1a;
        --text: #f0f0f0;
        --accent: #f1c40f;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        transition: background 0.3s;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px;
      }

      #theme-toggle {
        padding: 10px 20px;
        cursor: pointer;
        margin-bottom: 20px;
      }

      /* Representing a JS-drawn component */
      #data-visualizer {
        border: 2px solid var(--accent);
        width: 300px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <button id="theme-toggle">Switch Theme</button>
    <div id="data-visualizer">JS Component Area</div>

    <script src="mutation.js"></script>
  </body>
</html>
