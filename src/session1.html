<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .header {
        top: 0;
        background-color: lightblue;
        padding: 10px;
        font-size: 20px;
        opacity: 0.9;
        z-index: 100;
      }
      .card {
        transform: translateY(0px);
        /* position: relative; */
      }
      .tooltip {
        margin-top: -35px;
        background: red;
        padding: 30px;
      }

      .tooltip .tooltiptext {
        /* visibility: hidden; */
        width: 120px;
        background-color: black;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 5px;
      }

      /* .tooltip:hover .tooltiptext {
            visibility: visible;
        } */
    </style>
  </head>
  <body>
    <div class="header">Header</div>
    <div class="card">
      <div class="tooltip">
        Hover me
        <span class="tooltiptext">Tooltip text</span>
      </div>
    </div>
  </body>
</html>
