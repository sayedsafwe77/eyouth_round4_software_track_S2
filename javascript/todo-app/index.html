<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="./event_loop.js" defer></script>

    <style>
      .list {
        opacity: 1;
        transition: opacity 1s ease;
      }
      .disabled {
        opacity: 0;
      }
      .grandparent {
        background: lightgreen;
        width: 200px;
        height: 200px;
      }
      .parent {
        background: lightblue;
        height: 100px;
        width: 100px;
      }
      .child {
        background: lightcoral;
        height: 50px;
        width: 50px;
      }
      .image {
        width: 100px;
      }
    </style>
  </head>
  <body>
    <header>
      <input type="number" class="skip" placeholder="skip" value="0" />
      <input type="number" class="limit" placeholder="limit" value="15" />
      <button class="btn get-todo">Get Todos</button>
    </header>

    <section class="tods-section">
      <ul class="todos-list"></ul>
    </section>
  </body>
</html>
